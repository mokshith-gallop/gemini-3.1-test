  - id: prune-dmcharges
    mode: compare
    a:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmcharges
    b:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmcharges WHERE servicefromdate >= DATETIME('2020-01-01')
    compare:
