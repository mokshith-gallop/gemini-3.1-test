  - id: prune-factkpimonthend
    mode: compare
    a:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.factkpimonthend
    b:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.factkpimonthend WHERE invoicecreationperiod >= DATETIME('2020-01-01')
    compare:
      bytes_scanned: b <= a
  - id: prune-dmadjustment
    mode: compare
    a:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmadjustment
    b:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmadjustment WHERE adjustmentdate >= DATETIME('2020-01-01')
    compare:
      bytes_scanned: b <= a
  - id: prune-dmpayment
    mode: compare
    a:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmpayment
    b:
      sql: SELECT COUNT(*) AS n FROM `${DS_GOLD_ANALYTICS}`.dmpayment WHERE paymentpostingperiod >= DATETIME('2020-01-01')
    compare:
